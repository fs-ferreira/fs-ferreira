<svg width="560" height="820" viewBox="0 0 560 820" fill="none" style="background-color:transparent" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edge" x1="72" y1="56" x2="488" y2="764" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F3F46"/>
      <stop offset="0.5" stop-color="#18181B"/>
      <stop offset="1" stop-color="#52525B"/>
    </linearGradient>
    <linearGradient id="glow" x1="99" y1="164" x2="463" y2="650" gradientUnits="userSpaceOnUse">
