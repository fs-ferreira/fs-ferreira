  <text x="132" y="101" fill="#FAFAFA" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="16" font-weight="700" letter-spacing="2.4">GITHUB ACCESS PASS</text>
